[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
]
ignore = [
    "E501",  # Line length handled by formatter
    "B008",  # FastAPI Depends() in function argument defaults is standard idiom
    "E712",  # Comparison to True/False in SQLAlchemy filters and pytest assertions
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008", "E712"]
"backend/tests/*" = ["B008", "E712"]
