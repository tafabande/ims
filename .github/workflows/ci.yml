name: Enterprise IMS Production Pipeline & Verification

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-and-security:
    name: Backend Security, RBAC & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pip-audit ruff httpx

      - name: Backend Import Smoke Test
        run: |
          cd backend
          python -c "from app.main import app; print('FastAPI app imported successfully')"

      - name: Backend Static Quality & Linting (Ruff)
        run: |
          cd backend
          python -m ruff check app tests
          python -m ruff format --check app tests

      - name: Backend Dependency Audit
        run: |
          pip-audit -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          python -m pytest -v --tb=short

  frontend-build-and-lint:
    name: Frontend Warm Design System & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Linter (Oxlint)
        run: |
          cd frontend
          npm run lint

      - name: Verify Production Vite Bundle Build
        run: |
          cd frontend
          npm run build

  docker-and-deployment-readiness:
    name: Docker Stack & Deployment Verification
    runs-on: ubuntu-latest
    needs: [backend-quality-and-security, frontend-build-and-lint]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
          SECRET_KEY: ci_test_secret_key_not_for_production
          PASSWORD_SALT: ci_test_salt_not_for_production
          ENVIRONMENT: development

      - name: Verify Environment Template Parity
        run: |
          test -f .env.example || { echo "Missing .env.example template"; exit 1; }
          echo "Production environment templates verified."
