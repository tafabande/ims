version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: ims-gateway-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ims-api-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://ims_user:ims_secure_password@postgres:5432/ims_db
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost,http://127.0.0.1
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: ims-postgres-db
    restart: always
    environment:
      - POSTGRES_DB=ims_db
      - POSTGRES_USER=ims_user
      - POSTGRES_PASSWORD=ims_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ims-redis-cache
    restart: always
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
